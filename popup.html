<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="src/ui.css">
<style>
 body { width: 340px; padding: 16px; }
 h2 { font-size: 17px; margin: 0 0 12px; } h2 .a { color: var(--teal); } h2 .b { color: var(--coral); }
 .opt { display: block; width: 100%; text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 14px; margin: 0 0 10px; cursor: pointer; font: inherit; color: var(--ink); }
 .opt:hover { border-color: var(--teal); }
 .opt b { display: block; font-size: 15px; } .opt span { font-size: 13px; color: var(--muted); }
 .opt.c:hover { border-color: var(--coral); }
 p.small { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
</style></head>
<body>
 <h2><span class="a">Journal Finder</span> &amp; <span class="b">Predatory Check</span></h2>
 <button class="opt c" id="check"><b>🛡️ Check this journal's site</b><span>Lists, hijacked clones, ISSN, warning signs on the page, OpenAlex profile</span></button>
 <button class="opt" id="find"><b>🔭 Find a journal for my paper</b><span>Paste a title and abstract (selected text is copied in)</span></button>
 <p class="small" id="msg">The page is read only when you click, and nothing leaves your browser except OpenAlex queries.</p>
 <script type="module" src="src/popup.js"></script>
</body></html>
