<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#eadfca"/></pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1d2433" flood-opacity=".12"/></filter>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#0f9d8a"/><stop offset="1" stop-color="#2f80ed"/></linearGradient>
  </defs>
  <rect width="1200" height="420" fill="#fff8ec"/>
  <rect width="1200" height="420" fill="url(#dots)"/>
  <!-- marker blobs -->
  <circle cx="1130" cy="40" r="90" fill="#f2b705" opacity=".18"/>
  <circle cx="560" cy="400" r="70" fill="#ff6b4a" opacity=".14"/>

  <!-- title -->
  <g transform="translate(56 118)">
    <text font-size="15" fill="#6b7280" letter-spacing="4">CHROME EXTENSION · OPENALEX</text>
    <text y="62" font-size="54" font-weight="800" fill="#1d2433"><tspan fill="#0f9d8a">Journal Finder</tspan></text>
    <text y="118" font-size="54" font-weight="800" fill="#1d2433">&amp; <tspan fill="#ff6b4a">Predatory Check</tspan></text>
    <text y="160" font-size="19" fill="#1d2433">Where do papers like yours get published —</text>
    <text y="186" font-size="19" fill="#1d2433">and is that journal what it claims to be?</text>
    <g transform="translate(0 210)" font-size="13.5" font-weight="700">
      <rect width="150" height="30" rx="15" fill="#e6f7f4" stroke="#0f9d8a" stroke-width="1.5"/><text x="75" y="20" text-anchor="middle" fill="#0f9d8a">17/24 in the top 10</text>
      <rect x="162" width="156" height="30" rx="15" fill="#fff0ec" stroke="#ff6b4a" stroke-width="1.5"/><text x="240" y="20" text-anchor="middle" fill="#ff6b4a">113/113 clones caught</text>
      <rect x="330" width="128" height="30" rx="15" fill="#f2ebff" stroke="#7c3aed" stroke-width="1.5"/><text x="394" y="20" text-anchor="middle" fill="#7c3aed">e2e 17/17</text>
    </g>
  </g>

  <!-- journal cards sliding in -->
  <g font-size="14">
    <g filter="url(#sh)" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="40 0;0 0;0 0" keyTimes="0;.08;1" dur="8s" repeatCount="indefinite"/>
      <rect x="640" y="46" width="500" height="78" rx="14" fill="#fff" stroke="#f1e7d4"/>
      <text x="662" y="94" font-size="30" font-weight="800" fill="#f2b705">1</text>
      <text x="700" y="78" font-size="17" font-weight="700" fill="#1d2433">IEEE Access</text>
      <g transform="translate(700 92)" font-size="11.5" font-weight="700">
        <rect width="48" height="20" rx="10" fill="#f2ebff" stroke="#7c3aed"/><text x="24" y="14" text-anchor="middle" fill="#7c3aed">h 379</text>
        <rect x="54" width="48" height="20" rx="10" fill="#e6f7f4" stroke="#0f9d8a"/><text x="78" y="14" text-anchor="middle" fill="#0f9d8a">DOAJ</text>
        <rect x="108" width="76" height="20" rx="10" fill="#fff6d6" stroke="#a37900"/><text x="146" y="14" text-anchor="middle" fill="#a37900">APC $2,075</text>
      </g>
      <rect x="1020" y="60" width="100" height="10" rx="5" fill="#f5f1e8"/>
      <rect x="1020" y="60" width="0" height="10" rx="5" fill="url(#bar)"><animate attributeName="width" values="0;0;80;80" keyTimes="0;.1;.2;1" dur="8s" repeatCount="indefinite"/></rect>
    </g>
    <g filter="url(#sh)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.12;.2;.92;1" dur="8s" repeatCount="indefinite"/>
      <rect x="640" y="140" width="500" height="78" rx="14" fill="#fff" stroke="#f1e7d4"/>
      <text x="662" y="188" font-size="30" font-weight="800" fill="#0f9d8a">2</text>
      <text x="700" y="172" font-size="17" font-weight="700" fill="#1d2433">Wireless Personal Communications</text>
      <g transform="translate(700 186)" font-size="11.5" font-weight="700">
        <rect width="48" height="20" rx="10" fill="#f2ebff" stroke="#7c3aed"/><text x="24" y="14" text-anchor="middle" fill="#7c3aed">h 123</text>
        <rect x="54" width="70" height="20" rx="10" fill="#f5f1e8" stroke="#6b7280"/><text x="89" y="14" text-anchor="middle" fill="#6b7280">hybrid</text>
      </g>
      <rect x="1020" y="154" width="100" height="10" rx="5" fill="#f5f1e8"/>
      <rect x="1020" y="154" width="0" height="10" rx="5" fill="url(#bar)"><animate attributeName="width" values="0;0;42;42" keyTimes="0;.2;.3;1" dur="8s" repeatCount="indefinite"/></rect>
    </g>
    <!-- the flagged one -->
    <g filter="url(#sh)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.32;.4;.92;1" dur="8s" repeatCount="indefinite"/>
      <rect x="640" y="234" width="500" height="78" rx="14" fill="#fff6f6" stroke="#e5383b" stroke-width="2"/>
      <text x="662" y="282" font-size="30" font-weight="800" fill="#eadfca">3</text>
      <text x="700" y="266" font-size="17" font-weight="700" fill="#1d2433">Int. J. of Advanced Everything Research</text>
      <g transform="translate(700 280)" font-size="11.5" font-weight="700">
        <rect width="118" height="20" rx="10" fill="#e5383b"/><text x="59" y="14" text-anchor="middle" fill="#fff">⛔ hijacked host</text>
        <rect x="124" width="104" height="20" rx="10" fill="#fff0d6" stroke="#f29e02"/><text x="176" y="14" text-anchor="middle" fill="#a35f00">"Global IF 5.1"</text>
        <rect x="234" width="94" height="20" rx="10" fill="#fff0d6" stroke="#f29e02"/><text x="281" y="14" text-anchor="middle" fill="#a35f00">ISSN ✗ digit</text>
      </g>
    </g>
    <!-- shield stamp -->
    <g transform="translate(1112 300)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.5;.92;1" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" additive="sum" values="1.6;1.6;1;1" keyTimes="0;.45;.52;1" dur="8s" repeatCount="indefinite"/>
      <path d="M0 -44 L38 -30 V4 C38 28 18 42 0 50 C-18 42 -38 28 -38 4 V-30 Z" fill="#ff6b4a" stroke="#1d2433" stroke-width="5" stroke-linejoin="round"/>
      <text y="16" font-size="40" font-weight="900" text-anchor="middle" fill="#fff">!</text>
    </g>
    <text x="640" y="350" font-size="13" fill="#6b7280" opacity="0">50 similar papers vote · every warning shows its reason
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.5;.56;.92;1" dur="8s" repeatCount="indefinite"/></text>
  </g>
</svg>
